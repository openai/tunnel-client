name: Homebrew formula smoke

on:
  pull_request:
    paths:
      - .github/workflows/homebrew-formula-smoke.yml
      - pkg/version/VERSION
      - scripts/generate_homebrew_formula.sh
      - scripts/homebrew_service_smoke.py
  push:
    branches: [master]
    paths:
      - .github/workflows/homebrew-formula-smoke.yml
      - pkg/version/VERSION
      - scripts/generate_homebrew_formula.sh
      - scripts/homebrew_service_smoke.py
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public release tag to render and install in a local test tap
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Test Homebrew formula from public release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Derive release metadata
        id: release_meta
        env:
          HOMEBREW_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${HOMEBREW_RELEASE_TAG}" ]; then
            HOMEBREW_RELEASE_TAG="$(gh api repos/openai/tunnel-client/releases/latest --jq .tag_name)"
          fi
          ./scripts/release_tag.sh parse "${HOMEBREW_RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
      - name: Download published release checksums
        run: |
          curl -fsSLo SHA256SUMS.txt "${{ steps.release_meta.outputs.public_base_url }}/SHA256SUMS.txt"
      - name: Render and validate Homebrew formula
        env:
          HOMEBREW_RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
        run: |
          ./scripts/generate_homebrew_formula.sh \
            --tag "${HOMEBREW_RELEASE_TAG}" \
            --checksums SHA256SUMS.txt \
            --output tunnel-client.rb \
            --allow-prerelease
          ruby -c tunnel-client.rb
      - name: Test Homebrew install from published release
        run: |
          brew tap-new openai/tunnel-client-test
          cp tunnel-client.rb "$(brew --repository openai/tunnel-client-test)/Formula/tunnel-client.rb"
          brew readall openai/tunnel-client-test
          brew install openai/tunnel-client-test/tunnel-client
          brew test openai/tunnel-client-test/tunnel-client
          tunnel-client --version
          tunnel-client help quickstart >/dev/null
          prefix="$(brew --prefix tunnel-client)"
          test -x "${prefix}/libexec/tunnel-client"
          test -x "${prefix}/libexec/cloudflared"
          test -f "${prefix}/libexec/cloudflared-manifest.json"
      - name: Test Homebrew service lifecycle
        run: |
          python3 scripts/homebrew_service_smoke.py \
            --formula openai/tunnel-client-test/tunnel-client \
            --output "${{ runner.temp }}/tunnel-client-homebrew-service"
      - name: Preserve Homebrew service evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tunnel-client-homebrew-service
          path: ${{ runner.temp }}/tunnel-client-homebrew-service
